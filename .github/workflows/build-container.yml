  name: Build Apptainer Container

  on:
    push:
      paths:
        - 'pmdm.def'
        - '.github/workflows/build-container.yml'
    workflow_dispatch:

  permissions:
    packages: write
    contents: read

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install Apptainer
          uses: eWaterCycle/setup-apptainer@v2
          with:
            apptainer-version: 1.3.4

        - name: Build container
          run: sudo apptainer build pmdm.sif pmdm.def

        - name: Upload built .sif as artifact
          uses: actions/upload-artifact@v4
          with:
            name: pmdm-sif
            path: pmdm.sif

        - name: Push to GHCR
          run: |
            echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login --username ${{ github.actor }} --password-stdin oras://ghcr.io
            apptainer push pmdm.sif oras://ghcr.io/${{ github.repository }}/pmdm:latest
